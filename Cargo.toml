[package]
name = "hex3"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = []
single-threaded = []  # Disable rayon for cleaner profiling
research-landscape = [] # Quarantined landform/orogen evaluation laboratory

[[bin]]
name = "c0_orogen_smoke"
path = "src/bin/c0_orogen_smoke.rs"
required-features = ["research-landscape"]

[[bin]]
name = "landform_baseline"
path = "src/bin/landform_baseline.rs"
required-features = ["research-landscape"]

[[bin]]
name = "orogen_f_hc_compare"
path = "src/bin/orogen_f_hc_compare.rs"
required-features = ["research-landscape"]

[[bin]]
name = "orogen_g_probe"
path = "src/bin/orogen_g_probe.rs"
required-features = ["research-landscape"]

[[bin]]
name = "orogen_hcg_compare"
path = "src/bin/orogen_hcg_compare.rs"
required-features = ["research-landscape"]

[[bin]]
name = "orogen_linked_input"
path = "src/bin/orogen_linked_input.rs"
required-features = ["research-landscape"]

[[bin]]
name = "orogen_organization_graph"
path = "src/bin/orogen_organization_graph.rs"
required-features = ["research-landscape"]

[[bin]]
name = "rds0_support"
path = "src/bin/rds0_support.rs"
required-features = ["research-landscape"]

[[bin]]
name = "structural_mountain_organization_audit"
path = "src/bin/structural_mountain_organization_audit.rs"
required-features = ["research-landscape"]

[[bin]]
name = "orogen_testbed"
path = "src/bin/orogen_testbed.rs"
required-features = ["research-landscape"]

[[test]]
name = "orogen_testbed"
path = "tests/orogen_testbed.rs"
required-features = ["research-landscape"]

[[test]]
name = "orogen_testbed_c0"
path = "tests/orogen_testbed_c0.rs"
required-features = ["research-landscape"]

[profile.checked]
inherits = "release"
opt-level = 3
debug = true
debug-assertions = true

[profile.checked.package."*"]
debug = false
debug-assertions = false

[profile.profiled]
inherits = "release"
opt-level = 3
debug = true

[dependencies]
# Graphics
wgpu = "27"
winit = "0.30"
pollster = "0.4"

# Math
glam = { version = "0.30", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.19", features = ["derive"] }
encase = { version = "0.11", features = ["glam"] }

# Utilities
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
noise = "0.9"
ordered-float = "4.2"
log = "0.4"
env_logger = "0.11"
rayon = "1.10"

# Convex hull
qhull-enhanced = "0.1"

# Spatial indexing
kiddo = "4"

# Spherical Voronoi computation (knn-clipping backend). Upstream renamed the
# package; keep the local crate name so this substrate upgrade stays isolated
# from Hex3 naming churn.
s2-voronoi = { package = "voronoi-mesh", git = "https://github.com/PeterKlimk/s2-voronoi", rev = "e8804a639ea3c989e1ce9ea44b4c66c5f2d7e060" }

# CLI and serialization
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
bincode = "1"
flate2 = "1"

# PNG output (offscreen sweep renders)
png = "0.17"
